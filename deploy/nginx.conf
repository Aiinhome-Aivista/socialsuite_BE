# /etc/nginx/sites-available/social-suite
server {
    listen 80;
    server_name your-domain.com;

    # --- Frontend: static Vite build (SPA) ---
    root /var/www/social-suite/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # SPA client-side routing fallback
    }

    # --- Backend API (FastAPI via gunicorn on :8000) ---
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 200M;   # allow image/video uploads
}
# Then: sudo certbot --nginx   (HTTPS is required for social OAuth callbacks)
